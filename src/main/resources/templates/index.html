<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Blog | Posts</title>


    <!-- =========================
         BOOTSTRAP 5
    ========================== -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- =========================
         BOOTSTRAP ICONS
    ========================== -->

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- =========================
         CUSTOM CSS
    ========================== -->

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            font-family: Arial, Helvetica, sans-serif;
            color: #212529;
        }


        /* =========================
           NAVBAR
        ========================== */

        .navbar {
            background: linear-gradient(135deg, #111827, #1f2937);
            padding: 15px 0;
        }

        .navbar-brand {
            color: white !important;
            font-size: 1.45rem;
            font-weight: 700;
        }

        .navbar-brand i {
            margin-right: 8px;
        }


        /* =========================
           MAIN CONTAINER
        ========================== */

        .page-container {
            max-width: 1200px;
            margin: 45px auto;
        }


        /* =========================
           HEADER
        ========================== */

        .page-header {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            margin-bottom: 25px;
        }

        .page-header h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .page-header p {
            color: #6c757d;
            margin-bottom: 0;
        }


        /* =========================
           ADD BUTTON
        ========================== */

        .add-btn {
            padding: 11px 18px;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .add-btn:hover {
            transform: translateY(-2px);
        }


        /* =========================
           ACTION PANEL
        ========================== */

        .action-panel {
            background: white;
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            margin-bottom: 25px;
        }

        .action-panel-title {
            font-weight: 600;
            margin-bottom: 15px;
        }

        .post-id-input {
            height: 45px;
            border-radius: 9px;
        }

        .action-main-btn {
            height: 45px;
            border-radius: 9px;
            font-weight: 600;
        }


        /* =========================
           TABLE CARD
        ========================== */

        .table-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .table {
            margin-bottom: 0;
        }


        /* =========================
           TABLE HEADER
        ========================== */

        .table thead {
            background: #111827;
            color: white;
        }

        .table thead th {
            padding: 17px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }


        /* =========================
           TABLE BODY
        ========================== */

        .table tbody td {
            padding: 18px;
            vertical-align: middle;
        }

        .table tbody tr {
            transition: 0.2s ease;
        }

        .table tbody tr:hover {
            background: #f8f9fa;
        }


        /* =========================
           POST TITLE
        ========================== */

        .post-title {
            font-weight: 600;
            color: #212529;
        }


        /* =========================
           AUTHOR
        ========================== */

        .author {
            color: #6c757d;
        }


        /* =========================
           CONTENT
        ========================== */

        .post-content {
            max-width: 350px;
            color: #6c757d;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }


        /* =========================
           ID BADGE
        ========================== */

        .id-badge {
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 12px;
        }


        /* =========================
           TABLE ACTION BUTTONS
        ========================== */

        .action-btn {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s ease;
            margin-right: 4px;
        }


        /* EDIT */

        .edit-btn {
            background: #e7f1ff;
            color: #0d6efd;
        }

        .edit-btn:hover {
            background: #0d6efd;
            color: white;
        }


        /* DELETE */

        .delete-btn {
            background: #ffe7e7;
            color: #dc3545;
        }

        .delete-btn:hover {
            background: #dc3545;
            color: white;
        }


        /* =========================
           EMPTY STATE
        ========================== */

        .empty-state {
            text-align: center;
            padding: 65px 20px;
            color: #6c757d;
        }

        .empty-state i {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .empty-state h5 {
            color: #212529;
            font-weight: 600;
        }


        /* =========================
           FOOTER
        ========================== */

        .footer {
            text-align: center;
            padding: 25px;
            color: #6c757d;
            font-size: 14px;
        }


        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 768px) {

            .page-container {
                margin: 25px 15px;
            }

            .page-header {
                padding: 22px;
            }

            .page-header h2 {
                font-size: 23px;
            }

            .add-btn {
                width: 100%;
                margin-top: 18px;
            }

            .action-panel {
                padding: 18px;
            }

            .action-main-btn {
                width: 100%;
                margin-top: 8px;
            }

            .table-card {
                overflow-x: auto;
            }

            .table {
                min-width: 900px;
            }
        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
====================================================== -->

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="/">

            <i class="bi bi-journal-richtext"></i>

            My Blog

        </a>

    </div>

</nav>



<!-- =====================================================
     MAIN CONTENT
====================================================== -->

<div class="container page-container">


    <!-- =================================================
         PAGE HEADER
    ================================================== -->

    <div class="page-header">

        <div class="row align-items-center">

            <div class="col-md-8">

                <h2>

                    <i class="bi bi-file-earmark-text me-2"></i>

                    All Blog Posts

                </h2>

                <p>
                    Manage and organize all your blog posts.
                </p>

            </div>


            <div class="col-md-4 text-md-end">

                <a
                        href="/new"
                        class="btn btn-primary add-btn">

                    <i class="bi bi-plus-lg me-1"></i>

                    Add New Post

                </a>

            </div>

        </div>

    </div>



    <!-- =================================================
         MANUAL EDIT / DELETE PANEL
    ================================================== -->

    <div class="action-panel">

        <div class="action-panel-title">

            <i class="bi bi-gear me-2"></i>

            Manage Post by ID

        </div>


        <div class="row g-2 align-items-center">


            <!-- POST ID INPUT -->

            <div class="col-md-6">

                <input
                        type="number"
                        id="postIdInput"
                        class="form-control post-id-input"
                        placeholder="Enter Post ID">


            </div>


            <!-- EDIT BUTTON -->

            <div class="col-md-3">

                <button
                        type="button"
                        onclick="editPost()"
                        class="btn btn-primary action-main-btn w-100">

                    <i class="bi bi-pencil-square me-1"></i>

                    Edit Post

                </button>

            </div>


            <!-- DELETE BUTTON -->

            <div class="col-md-3">

                <button
                        type="button"
                        onclick="deletePost()"
                        class="btn btn-danger action-main-btn w-100">

                    <i class="bi bi-trash3 me-1"></i>

                    Delete Post

                </button>

            </div>


        </div>

    </div>



    <!-- =================================================
         POSTS TABLE
    ================================================== -->

    <div class="table-card">

        <div class="table-responsive">

            <table class="table table-hover align-middle">


                <!-- TABLE HEADER -->

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Post Title</th>

                    <th>Author</th>

                    <th>Content</th>

                    <th>Actions</th>

                </tr>

                </thead>



                <!-- TABLE BODY -->

                <tbody>


                <!-- =================================================
                     LOOP THROUGH ALL POSTS
                ================================================== -->

                <tr th:each="post : ${listPosts}">


                    <!-- ID -->

                    <td>

                        <span
                                class="badge bg-secondary id-badge"
                                th:text="${post.id}">

                            1

                        </span>

                    </td>



                    <!-- TITLE -->

                    <td>

                        <div
                                class="post-title"
                                th:text="${post.title}">

                            Post Title

                        </div>

                    </td>



                    <!-- AUTHOR -->

                    <td>

                        <span class="author">

                            <i class="bi bi-person-circle me-1"></i>

                            <span th:text="${post.author}">

                                Author

                            </span>

                        </span>

                    </td>



                    <!-- CONTENT -->

                    <td>

                        <div
                                class="post-content"
                                th:text="${post.content}">

                            Post content goes here...

                        </div>

                    </td>



                    <!-- ACTIONS -->

                    <td>


                        <!-- EDIT -->

                        <a
                                th:href="@{'/edit/' + ${post.id}}"
                                class="action-btn edit-btn">

                            <i class="bi bi-pencil-square me-1"></i>

                            Edit

                        </a>



                        <!-- DELETE -->

                        <a
                                th:href="@{'/delete/' + ${post.id}}"
                                class="action-btn delete-btn"
                                onclick="return confirm('Are you sure you want to delete this post?');">

                            <i class="bi bi-trash3 me-1"></i>

                            Delete

                        </a>


                    </td>


                </tr>



                <!-- =================================================
                     EMPTY STATE
                ================================================== -->

                <tr th:if="${#lists.isEmpty(listPosts)}">

                    <td colspan="5">

                        <div class="empty-state">

                            <i class="bi bi-journal-x"></i>

                            <h5>
                                No Blog Posts Found
                            </h5>

                            <p>
                                You haven't created any posts yet.
                            </p>




                        </div>

                    </td>

                </tr>


                </tbody>

            </table>

        </div>

    </div>


</div>



<!-- =====================================================
     FOOTER
====================================================== -->

<div class="footer">

    © 2026 My Blog. All rights reserved.

</div>



<!-- =====================================================
     BOOTSTRAP JAVASCRIPT
====================================================== -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<!-- =====================================================
     CUSTOM JAVASCRIPT
====================================================== -->

<script>

    /* ============================================
       EDIT POST
    ============================================ */

    function editPost() {

        const id = document.getElementById("postIdInput").value.trim();

        if (id) {

            window.location.href = "/edit/" + id;

        } else {

            alert("Please enter a valid Post ID.");

        }

    }



    /* ============================================
       DELETE POST
    ============================================ */

    function deletePost() {

        const id = document.getElementById("postIdInput").value.trim();

        if (!id) {

            alert("Please enter a valid Post ID.");

            return;

        }


        const confirmDelete = confirm(
            "Are you sure you want to delete post ID " + id + "?"
        );


        if (confirmDelete) {

            window.location.href = "/delete/" + id;

        }

    }

</script>


</body>

</html>
