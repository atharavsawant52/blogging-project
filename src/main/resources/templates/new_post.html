<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create New Post | My Blog</title>


    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f7fb;
            font-family: Arial, Helvetica, sans-serif;
            color: #212529;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background: linear-gradient(135deg, #111827, #1f2937);
            padding: 15px 0;
        }

        .navbar-brand {
            color: white !important;
            font-size: 1.45rem;
            font-weight: 700;
        }

        .navbar-brand i {
            margin-right: 8px;
        }

        .back-link {
            color: #d1d5db;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: white;
        }


        /* =========================
           MAIN
        ========================= */

        .page-container {
            max-width: 850px;
            margin: 45px auto;
        }


        /* =========================
           HEADER
        ========================= */

        .page-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #6c757d;
            margin: 0;
        }


        /* =========================
           FORM CARD
        ========================= */

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.07);
        }


        /* =========================
           FORM LABEL
        ========================= */

        .form-label {
            font-weight: 600;
            margin-bottom: 8px;
        }


        /* =========================
           INPUTS
        ========================= */

        .form-control {
            border: 1px solid #d9dee7;
            border-radius: 10px;
            padding: 12px 14px;
            transition: 0.2s ease;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 180px;
        }


        /* =========================
           ICON
        ========================= */

        .field-icon {
            color: #0d6efd;
            margin-right: 6px;
        }


        /* =========================
           BUTTONS
        ========================= */

        .btn-custom {
            border-radius: 10px;
            padding: 11px 20px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .btn-custom:hover {
            transform: translateY(-2px);
        }


        /* =========================
           FORM FOOTER
        ========================= */

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid #eeeeee;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;
            color: #6c757d;
            font-size: 14px;
            padding: 20px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 768px) {

            .page-container {
                margin: 30px 15px;
            }

            .form-card {
                padding: 25px 20px;
            }

            .page-header h1 {
                font-size: 26px;
            }

            .form-footer {
                flex-direction: column;
                gap: 12px;
            }

            .form-footer a,
            .form-footer button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
====================================================== -->

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="/">

            <i class="bi bi-journal-richtext"></i>

            My Blog

        </a>


        <a href="/" class="back-link">

            <i class="bi bi-arrow-left me-1"></i>

            Back to Posts

        </a>

    </div>

</nav>



<!-- =====================================================
     MAIN CONTENT
====================================================== -->

<div class="container page-container">


    <!-- HEADER -->

    <div class="page-header">

        <h1>

            <i class="bi bi-pencil-square text-primary me-2"></i>

            Create New Blog Post

        </h1>

        <p>
            Share your thoughts, ideas and stories with your readers.
        </p>

    </div>



    <!-- =================================================
         FORM
    ================================================== -->

    <div class="form-card">


        <!--
            IMPORTANT:

            Controller mein Post object
            "post" naam se model mein hona chahiye.

            Example:

            model.addAttribute("post", new Post());
        -->

        <form
                th:action="@{/save}"
                th:object="${post}"
                method="post">


            <!-- =========================================
                 TITLE
            ========================================== -->

            <div class="mb-4">

                <label
                        for="title"
                        class="form-label">

                    <i class="bi bi-type field-icon"></i>

                    Post Title

                </label>


                <input
                        type="text"
                        id="title"
                        th:field="*{title}"
                        class="form-control"
                        placeholder="Enter your post title"
                        required>

            </div>



            <!-- =========================================
                 AUTHOR
            ========================================== -->

            <div class="mb-4">

                <label
                        for="author"
                        class="form-label">

                    <i class="bi bi-person field-icon"></i>

                    Author

                </label>


                <input
                        type="text"
                        id="author"
                        th:field="*{author}"
                        class="form-control"
                        placeholder="Enter author name"
                        required>

            </div>



            <!-- =========================================
                 CONTENT
            ========================================== -->

            <div class="mb-4">

                <label
                        for="content"
                        class="form-label">

                    <i class="bi bi-file-text field-icon"></i>

                    Post Content

                </label>


                <textarea
                        id="content"
                        th:field="*{content}"
                        class="form-control"
                        rows="8"
                        placeholder="Write your post content here..."
                        required></textarea>

            </div>



            <!-- =========================================
                 FORM FOOTER
            ========================================== -->

            <div class="form-footer">


                <!-- CANCEL -->

                <a
                        href="/"
                        class="btn btn-secondary btn-custom">

                    <i class="bi bi-x-lg me-1"></i>

                    Cancel

                </a>



                <!-- SAVE -->

                <button
                        type="submit"
                        class="btn btn-primary btn-custom">

                    <i class="bi bi-send me-1"></i>

                    Publish Post

                </button>


            </div>


        </form>

    </div>

</div>



<!-- =====================================================
     FOOTER
====================================================== -->

<div class="footer">

    © 2026 My Blog. All rights reserved.

</div>



<!-- Bootstrap JS -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
